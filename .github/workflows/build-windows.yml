name: Release build (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, куда загрузить сборку (например v1.0.0). Если пусто — последний релиз.'
        required: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Сборка Windows
        run: flutter build windows --release

      - name: Упаковка
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'yavka-windows-x64.zip'

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if (-not $tag) { $tag = '${{ inputs.tag }}' }
          if (-not $tag) { $tag = (gh release view --json tagName --jq .tagName) }
          Write-Host "Uploading to release $tag"
          gh release upload "$tag" 'yavka-windows-x64.zip' --clobber --repo '${{ github.repository }}'
