name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрая проверка логики: работает на любой платформе.
  analyze-and-test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ
        # Info-замечания (deprecated) не проваливают анализ: падаем
        # только на error и warning.
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        run: flutter test

  # Сборки-проверки: ловят поломки платформенных частей до релиза.
  # Отметки и OAuth-клиент сюда не вшиваются — это работа релиза.
  linux-check:
    name: Сборка Linux (проверка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Зависимости для сборки Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Сборка Linux
        run: flutter build linux --release

  android-check:
    name: Сборка Android (проверка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Сборка Android
        run: flutter build apk --debug

  web-check:
    name: Сборка Web (проверка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Сборка Web
        run: flutter build web --release
