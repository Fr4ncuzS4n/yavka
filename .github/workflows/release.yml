name: Release build

# Релиз создаётся автоматически: пушишь в main версию выше прежней
# (поле version в pubspec.yaml, тег берётся из неё: 1.1.0+2 → v1.1.0) —
# workflow ставит тег, создаёт Release и прикладывает сборки всех
# платформ:
#   yavka-android.apk            — Android (файл автообновления)
#   yavka-linux-x64.tar.gz       — архив для Linux
#   yavka-linux-x64.deb          — пакет deb
#   yavka-linux-x64.rpm          — пакет rpm (универсальный)
#   yavka-linux-x64.AppImage     — AppImage (файл автообновления)
#   yavka-windows-x64.zip        — архив для Windows
#   yavka-windows-x64-setup.exe  — инсталлятор (файл автообновления)
#   yavka-ios-unsigned.ipa       — iOS без подписи (для установки нужна
#                                  подпись: TestFlight или пересборка)
# Если версия не менялась — ничего не собирается.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0). Если пусто — по версии в pubspec.yaml.'
        required: false

permissions:
  contents: write

env:
  # OAuth-клиент вшивается в сборку: пользователю не нужно регистрировать
  # свой проект в Google Cloud — только нажать «Разрешить». Для installed
  # приложений Google прямо разрешает не считать Client Secret секретом.
  # Пустые секреты (пока они не настроены) дают сборку без клиента —
  # тогда клиент настраивается вручную в приложении.
  DART_DEFINES: >-
    --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
    --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
    --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

jobs:
  release:
    name: Создание релиза
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужны теги, чтобы сравнить с последним

      - name: Определение версии
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          base="${version%%+*}" # 1.1.0+2 → 1.1.0
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then tag="v$base"; fi
          echo "Версия в pubspec: $version → тег $tag"

          # Пуш с той же версией: релиз уже выходил, собирать нечего.
          if [ "${{ github.event_name }}" = "push" ] &&
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Тег $tag уже существует — релиз не создаётся."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Релиз создаётся один раз до сборок; если он уже есть
          # (например, пересборка после ручного запуска) — просто
          # доливаем файлы в него.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Явка $tag" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Сборка Windows
        run: flutter build windows --release ${{ env.DART_DEFINES }}

      - name: Упаковка
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'yavka-windows-x64.zip'

      # Инсталлятор Windows: папка Release пакуется в один setup.exe
      # через Inno Setup (скрипт windows/installer.iss).
      - name: Установка Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Сборка инсталлятора
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value
          $base = ($version -split '\+')[0]
          Write-Host "Версия инсталлятора: $base"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$base" "/O$env:GITHUB_WORKSPACE" 'windows\installer.iss'

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Write-Host "Uploading to release $env:RELEASE_TAG"
          gh release upload "$env:RELEASE_TAG" 'yavka-windows-x64.zip' 'yavka-windows-x64-setup.exe' --clobber --repo '${{ github.repository }}'

  android:
    name: Android (APK)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Сборка Android APK
        run: flutter build apk --release ${{ env.DART_DEFINES }}

      - name: Упаковка
        run: cp build/app/outputs/flutter-apk/app-release.apk yavka-android.apk

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Uploading to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" yavka-android.apk --clobber --repo '${{ github.repository }}'

  ios:
    name: iOS (неподписанный IPA)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      # Без кодовой подписи: для подписи нужны сертификат Apple
      # Developer и профиль — их в репозитории нет.
      - name: Сборка iOS
        run: flutter build ios --release --no-codesign ${{ env.DART_DEFINES }}

      # Runner.app в Payload/ = IPA, который принимают сидлоад-инструменты
      # и службы пересборки (AltStore, Sideloadly, TestFlight после подписи).
      - name: Упаковка IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry yavka-ios-unsigned.ipa Payload

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Uploading to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" yavka-ios-unsigned.ipa --clobber --repo '${{ github.repository }}'

  linux:
    name: Linux x64
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Зависимости для сборки Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm

      - name: Сборка Linux
        run: flutter build linux --release ${{ env.DART_DEFINES }}

      - name: Определение версии
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          echo "BASE_VERSION=${version%%+*}" >> "$GITHUB_ENV"

      - name: Архив tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/yavka-linux-x64.tar.gz" .

      # Общий .desktop для deb, rpm и AppImage: Exec=yavka — бинарь
      # ставится в /usr/bin (симлинк на /opt/yavka) или лежит рядом
      # в AppImage.
      - name: Файл .desktop
        run: |
          cat > "$GITHUB_WORKSPACE/yavka.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Явка
          Comment=Учёт посещаемости
          Exec=yavka
          Icon=yavka
          Terminal=false
          Categories=Utility;
          EOF

      - name: Пакет deb
        run: |
          pkg="$GITHUB_WORKSPACE/deb/yavka"
          mkdir -p "$pkg/DEBIAN" "$pkg/opt/yavka" "$pkg/usr/bin" \
            "$pkg/usr/share/applications" \
            "$pkg/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$pkg/opt/yavka/"
          ln -s /opt/yavka/yavka "$pkg/usr/bin/yavka"
          cp "$GITHUB_WORKSPACE/yavka.desktop" "$pkg/usr/share/applications/"
          cp web/icons/Icon-512.png "$pkg/usr/share/icons/hicolor/512x512/apps/yavka.png"
          mkdir -p "$pkg/usr/share/doc/yavka"
          cp LICENSE "$pkg/usr/share/doc/yavka/copyright"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: yavka
          Version: $BASE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libglib2.0-0, libdbus-1-3
          Maintainer: Fr4ncuzS4n <Fr4ncuzS4n@users.noreply.github.com>
          Description: Явка — учёт посещаемости группы
          EOF
          dpkg-deb --build --root-owner-group "$pkg" "$GITHUB_WORKSPACE/yavka-linux-x64.deb"

      - name: Пакет rpm
        run: |
          cat > "$GITHUB_WORKSPACE/yavka.spec" <<EOF
          Name:           yavka
          Version:        $BASE_VERSION
          Release:        1
          Summary:        Явка — учёт посещаемости
          License:        GPL-3.0-only
          BuildArch:      x86_64
          Requires:       gtk3 glib2 dbus-libs

          %description
          Приложение «Явка» для учёта посещаемости.

          %install
          mkdir -p %{buildroot}/opt/yavka %{buildroot}%{_bindir} \\
            %{buildroot}%{_datadir}/applications \\
            %{buildroot}%{_datadir}/icons/hicolor/512x512/apps \\
            %{buildroot}%{_docdir}/yavka
          cp -r "$GITHUB_WORKSPACE/build/linux/x64/release/bundle/." %{buildroot}/opt/yavka/
          ln -s /opt/yavka/yavka %{buildroot}%{_bindir}/yavka
          cp "$GITHUB_WORKSPACE/yavka.desktop" %{buildroot}%{_datadir}/applications/
          cp "$GITHUB_WORKSPACE/web/icons/Icon-512.png" \\
            %{buildroot}%{_datadir}/icons/hicolor/512x512/apps/yavka.png
          cp "$GITHUB_WORKSPACE/LICENSE" %{buildroot}%{_docdir}/yavka/LICENSE

          %files
          /opt/yavka
          %{_bindir}/yavka
          %{_datadir}/applications/yavka.desktop
          %{_datadir}/icons/hicolor/512x512/apps/yavka.png
          %{_docdir}/yavka/LICENSE
          EOF
          mkdir -p .rpmbuild/BUILD .rpmbuild/RPMS .rpmbuild/SPECS
          rpmbuild -bb --define "_topdir $PWD/.rpmbuild" "$GITHUB_WORKSPACE/yavka.spec"
          cp .rpmbuild/RPMS/x86_64/yavka-*.rpm "$GITHUB_WORKSPACE/yavka-linux-x64.rpm"

      # AppImage: AppRun подкладывает lib/ бандла в LD_LIBRARY_PATH,
      # остальное — стандартный AppDir. Инструмент запускается через
      # --appimage-extract-and-run: на runner нет FUSE.
      - name: AppImage
        run: |
          curl -fsSL -o "$GITHUB_WORKSPACE/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$GITHUB_WORKSPACE/appimagetool"
          appdir="$GITHUB_WORKSPACE/AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$appdir/usr/bin/"
          cp "$GITHUB_WORKSPACE/yavka.desktop" "$appdir/yavka.desktop"
          cp "$GITHUB_WORKSPACE/yavka.desktop" "$appdir/usr/share/applications/"
          cp web/icons/Icon-512.png "$appdir/yavka.png"
          mkdir -p "$appdir/usr/share/doc/yavka"
          cp LICENSE "$appdir/usr/share/doc/yavka/LICENSE"
          cp web/icons/Icon-512.png "$appdir/usr/share/icons/hicolor/512x512/apps/yavka.png"
          ln -s yavka.png "$appdir/.DirIcon"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/yavka" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          ARCH=x86_64 "$GITHUB_WORKSPACE/appimagetool" --appimage-extract-and-run \
            "$appdir" "$GITHUB_WORKSPACE/yavka-linux-x64.AppImage"

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Uploading to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            yavka-linux-x64.tar.gz \
            yavka-linux-x64.deb \
            yavka-linux-x64.rpm \
            yavka-linux-x64.AppImage \
            --clobber --repo '${{ github.repository }}'

  web:
    name: Web
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Публикация сборок в релиз и деплой сайта на GitHub Pages.
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Сборка Web
        # Приложение живёт по адресу <сайт>/yavka/app/, лендинг —
        # на <сайт>/yavka/ (страницы из docs/).
        run: flutter build web --release --base-href=/yavka/app/ ${{ env.DART_DEFINES }}

      - name: Архив для релиза
        run: |
          cd build/web
          zip -qr "$GITHUB_WORKSPACE/yavka-web.zip" .

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Uploading to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" yavka-web.zip --clobber --repo '${{ github.repository }}'

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Pages включается автоматически при первом деплое.
          enablement: true

      - name: 'Сборка сайта: лендинг (docs/) + приложение'
        run: |
          mkdir -p site/app
          cp -r docs/. site/
          cp -r build/web/. site/app/

      - name: Публикация артефакта Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Деплой на GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
