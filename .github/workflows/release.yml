name: Release build

# Релиз создаётся автоматически: пушишь в main версию выше прежней
# (поле version в pubspec.yaml, тег берётся из неё: 1.1.0+2 → v1.1.0) —
# workflow ставит тег, создаёт Release и прикладывает сборки всех
# платформ. Если версия не менялась — ничего не собирается.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0). Если пусто — по версии в pubspec.yaml.'
        required: false

permissions:
  contents: write

env:
  # OAuth-клиент вшивается в сборку: пользователю не нужно регистрировать
  # свой проект в Google Cloud — только нажать «Разрешить». Для installed
  # приложений Google прямо разрешает не считать Client Secret секретом.
  # Пустые секреты (пока они не настроены) дают сборку без клиента —
  # тогда клиент настраивается вручную в приложении.
  DART_DEFINES: >-
    --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
    --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
    --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

jobs:
  release:
    name: Создание релиза
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужны теги, чтобы сравнить с последним

      - name: Определение версии
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          base="${version%%+*}" # 1.1.0+2 → 1.1.0
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then tag="v$base"; fi
          echo "Версия в pubspec: $version → тег $tag"

          # Пуш с той же версией: релиз уже выходил, собирать нечего.
          if [ "${{ github.event_name }}" = "push" ] &&
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Тег $tag уже существует — релиз не создаётся."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Релиз создаётся один раз до сборок; если он уже есть
          # (например, пересборка после ручного запуска) — просто
          # доливаем файлы в него.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Явка $tag" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Сборка Windows
        run: flutter build windows --release ${{ env.DART_DEFINES }}

      - name: Упаковка
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'yavka-windows-x64.zip'

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Write-Host "Uploading to release $env:RELEASE_TAG"
          gh release upload "$env:RELEASE_TAG" 'yavka-windows-x64.zip' --clobber --repo '${{ github.repository }}'

  android:
    name: Android (APK)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Сборка Android APK
        run: flutter build apk --release ${{ env.DART_DEFINES }}

      - name: Упаковка
        run: cp build/app/outputs/flutter-apk/app-release.apk yavka-android.apk

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Uploading to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" yavka-android.apk --clobber --repo '${{ github.repository }}'

  linux:
    name: Linux x64
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Зависимости для сборки Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Сборка Linux
        run: flutter build linux --release ${{ env.DART_DEFINES }}

      - name: Упаковка
        run: |
          cd build/linux/x64/release/bundle
          zip -qr "$GITHUB_WORKSPACE/yavka-linux-x64.zip" .

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Uploading to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" yavka-linux-x64.zip --clobber --repo '${{ github.repository }}'

  web:
    name: Web
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Публикация сборок в релиз и деплой сайта на GitHub Pages.
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Сборка Web
        # Приложение живёт по адресу <сайт>/yavka/app/, лендинг —
        # на <сайт>/yavka/ (страницы из docs/).
        run: flutter build web --release --base-href=/yavka/app/ ${{ env.DART_DEFINES }}

      - name: Архив для релиза
        run: |
          cd build/web
          zip -qr "$GITHUB_WORKSPACE/yavka-web.zip" .

      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Uploading to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" yavka-web.zip --clobber --repo '${{ github.repository }}'

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Pages включается автоматически при первом деплое.
          enablement: true

      - name: 'Сборка сайта: лендинг (docs/) + приложение'
        run: |
          mkdir -p site/app
          cp -r docs/. site/
          cp -r build/web/. site/app/

      - name: Публикация артефакта Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Деплой на GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
