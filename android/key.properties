// Ключ подписи релизных сборок. Файл и хранилище лежат в репозитории:
// подпись должна быть одной и той же во всех сборках (локальных и CI),
// иначе Android не поставит новый APK поверх установленного приложения
// — та самая «бесконечная установка». Приложение распространяется
// сборками с GitHub Releases, обновление ставит сам человек, поэтому
// публичность ключа здесь не делает хуже: главный эффект — стабильная
// подпись.
storePassword=yavka-release-key
keyPassword=yavka-release-key
keyAlias=yavka
storeFile=yavka-release.jks
